name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: リント・型チェック・単体テスト
        run: npm run check

      - name: ビルド
        run: npm run build
        env:
          # GitHub Pages の URL は https://{ユーザー名}.github.io/{リポジトリ名}/ になる
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # 以下はリポジトリの Variables（Settings > Secrets and variables > Actions）で上書きできる
          VITE_OVERPASS_URL: ${{ vars.VITE_OVERPASS_URL }}
          VITE_NOMINATIM_URL: ${{ vars.VITE_NOMINATIM_URL }}
          VITE_DEFAULT_CENTER: ${{ vars.VITE_DEFAULT_CENTER }}
          VITE_DEFAULT_ZOOM: ${{ vars.VITE_DEFAULT_ZOOM }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
